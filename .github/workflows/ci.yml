name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Ruff and mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # setup-uv publishes exact versions only, so there is no moving `v10` tag.
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --locked --group dev

      - name: Report the interpreter
        run: uv run --no-sync python -c "import sys; print(sys.version)"

      - name: Check formatting
        run: uv run --no-sync ruff format --check src tests examples

      - name: Lint
        run: uv run --no-sync ruff check src tests examples

      - name: Type check
        run: uv run --no-sync mypy

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --locked --group dev

      - name: Report the interpreter
        run: uv run --no-sync python -c "import sys; print(sys.version)"

      - name: Run tests
        run: uv run --no-sync pytest --cov --cov-report=term-missing

  sandbox:
    # The sandbox backends enforce a boundary the kernel provides, so they are
    # tested against the real thing: Seatbelt on macOS, bubblewrap on Linux.
    # ZETT_REQUIRE_SANDBOX makes a missing backend a failure, not a skip.
    name: Sandbox (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      ZETT_REQUIRE_SANDBOX: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Install bubblewrap
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          # Ubuntu 24.04 stops unprivileged programs from creating user namespaces.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Sync dependencies
        run: uv sync --locked --group dev

      - name: Show what this runner's cgroup offers
        if: runner.os == 'Linux'
        run: |
          echo "--- /proc/self/cgroup"; cat /proc/self/cgroup
          dir="/sys/fs/cgroup$(sed -n 's/^0:://p' /proc/self/cgroup)"
          echo "--- own cgroup: $dir"
          for f in cgroup.controllers cgroup.subtree_control; do echo "$f: $(cat "$dir/$f" 2>&1)"; done
          echo "--- parent cgroup: $(dirname "$dir")"
          for f in cgroup.controllers cgroup.subtree_control; do echo "$f: $(cat "$(dirname "$dir")/$f" 2>&1)"; done
          echo "--- can this user create a child group?"
          mkdir "$dir/zett-probe" 2>&1 && { ls "$dir/zett-probe" | tr '\n' ' '; echo; rmdir "$dir/zett-probe"; } || true
          echo "--- user: $(id -un) uid=$(id -u)"

      - name: Report how this runner enforces each limit
        run: |
          uv run --no-sync python - <<'PY'
          from zett_agent.sandbox.factory import create_sandbox
          from zett_agent.sandbox.policy import ResourceLimits, SandboxPolicy

          limits = ResourceLimits(
              memory_bytes=256 * 1024**2, cpu_seconds=30, cpu_percent=50, processes=64, file_size_bytes=10**6
          )
          report = create_sandbox(SandboxPolicy(writable_paths=["/tmp"], limits=limits)).capabilities()
          print("enforcement:", report.mechanisms)
          for warning in report.warnings:
              print("warning:", warning)
          PY

      - name: Run sandbox tests
        run: |
          uv run --no-sync pytest tests/test_sandbox_policy.py tests/test_sandbox_builders.py \
            tests/test_sandbox_runner.py tests/test_sandbox_resources.py tests/test_sandbox_session.py \
            tests/test_sandbox_backends.py \
            -v --no-cov

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Lint documentation helpers
        run: uv run --group docs ruff check docs

      - name: Build documentation and run offline examples
        run: uv run --group docs pytest tests/test_documentation.py tests/test_documentation_examples.py -q

  package:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Build
        run: uv build

      - name: Verify runtime packaging and JIT prompt resources
        run: |
          python3 - <<'PY'
          import glob
          import tarfile
          import zipfile
          from pathlib import Path

          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          assert any(name.startswith("zett_agent/") for name in names), names
          unexpected = [name for name in names if not name.startswith(("zett_agent/", "zett_agent-"))]
          assert not unexpected, unexpected
          resource = "zett_agent/jit_harness/instructions.md"
          inspection = "zett_agent/jit_harness/inspection.md"
          with zipfile.ZipFile(wheel) as archive:
              for name in (resource, inspection):
                  assert archive.read(name) == (Path("src") / name).read_bytes(), name
          sdist = glob.glob("dist/*.tar.gz")[0]
          with tarfile.open(sdist) as archive:
              names = archive.getnames()
              for name in (resource, inspection):
                  matches = [item for item in names if item.endswith("/" + name)]
                  assert len(matches) == 1, matches
                  assert archive.extractfile(matches[0]).read() == (Path("src") / name).read_bytes()
          print(f"{wheel}: {len(names)} files")
          print(f"{sdist}: JIT prompt resource verified")
          PY
