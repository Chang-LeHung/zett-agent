</g>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="96" y="440" fill="#f3f5f8" font-size="104" font-weight="700" letter-spacing="-3">Zett Agent</text>
    <text x="100" y="508" fill="#ffb020" font-size="42" font-weight="500">Agents that forge the tools they need.</text>
    <text x="100" y="574" fill="#8a96a6" font-size="28" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">pip install zett-agent</text>
