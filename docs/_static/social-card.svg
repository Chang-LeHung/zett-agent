      <stop offset=".42" stop-color="#ff6a1f"/>
      <stop offset=".62" stop-color="#d6dde6"/>
      <stop offset="1" stop-color="#9aa7b8"/>
    </linearGradient>
    <radialGradient id="glow" cx="50" cy="12" r="30" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ff7a1f" stop-opacity=".35"/>
      <stop offset="1" stop-color="#ff7a1f" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#tile)"/>
  <rect width="64" height="64" rx="15" fill="url(#glow)"/>
  <rect x=".5" y=".5" width="63" height="63" rx="14.5" fill="none" stroke="#3a4554"/>
  <g data-part="sword" transform="translate(32 33) rotate(45) scale(.9) translate(-32 -30.6)">
    <path data-part="blade" fill="url(#heat)" d="M32 2 L36.4 12.5 V40 H27.6 V12.5 Z"/>
    <path data-part="facet" fill="#000" opacity=".16" d="M32 2 L36.4 12.5 V40 H32 Z"/>
    <rect data-part="guard" fill="#dfe6ee" x="20.5" y="40" width="23" height="4.2" rx="2.1"/>
