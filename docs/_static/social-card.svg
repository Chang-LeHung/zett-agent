<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-labelledby="title desc">
  <title id="title">Zett Agent</title>
  <desc id="desc">Zett Agent: agents that forge the tools they need.</desc>
  <defs>
    <radialGradient id="ember" cx="20%" cy="22%" r="70%">
      <stop stop-color="#ff7a1f" stop-opacity=".26"/>
      <stop offset="1" stop-color="#ff7a1f" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="#0d1014"/>
  <rect width="1200" height="630" fill="url(#ember)"/>
  <g transform="translate(96 88) scale(3)">
  <defs>
    <linearGradient id="tile" x1="8" y1="0" x2="56" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#222a35"/>
      <stop offset="1" stop-color="#0b0e12"/>
    </linearGradient>
    <linearGradient id="heat" x1="0" y1="2" x2="0" y2="42" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff2c4"/>
