[project]
name = "zett-agent"
version = "0.2.0.dev0"
description = "A small readable model and tool loop"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Chang-LeHung"}]
keywords = ["agent", "llm", "streaming", "tools"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
  "sqlalchemy>=2.0,<3",
  "tiktoken>=0.12,<1",
  "uuid6>=2024.7.10,<2027",
  "httpx>=0.27,<1",
  "pydantic>=2.12,<3",
  "prompt-toolkit>=3.0,<4",
  "truststore>=0.10,<1",
  "openai>=2.54,<3",
  "anthropic>=0.125,<1",
  "google-genai>=2.22,<3",
  "ollama>=0.6.2,<1",
  "mcp>=2.1,<3",
  "mcp-types>=2.1,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.urls]
Repository = "https://github.com/Chang-LeHung/knowledge-cards-system"

[tool.hatch.build.targets.wheel]
packages = ["src/zett_agent"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/README.md", "/LICENSE", "/pyproject.toml"]

[dependency-groups]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.26,<2",
  "pytest-cov>=7,<8",
  "ruff>=0.11,<1",
]
docs = [
    "pydata-sphinx-theme>=0.16,<1",
    "sphinx>=8,<10",
    "sphinx-copybutton>=0.5,<1",
    "sphinxcontrib-mermaid>=2,<3",
]
docs-test = [
    "playwright>=1.50,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["zett_agent"]
branch = true

[tool.coverage.report]
fail_under = 95
show_missing = true

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["zett_agent"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
