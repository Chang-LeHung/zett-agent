[project]
name = "kcs-agent"
version = "0.2.0.dev0"
description = "A small readable model and tool loop"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Chang-LeHung"}]
keywords = ["agent", "llm", "streaming", "tools"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.12,<3",
  "truststore>=0.10,<1",
  "openai>=2.54,<3",
  "anthropic>=0.125,<1",
  "google-genai>=2.22,<3",
  "ollama>=0.6.2,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.urls]
Repository = "https://github.com/Chang-LeHung/knowledge-cards-system"

[tool.hatch.build.targets.wheel]
packages = ["src/kcs_agent"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/README.md", "/LICENSE", "/pyproject.toml"]

[dependency-groups]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.26,<2",
  "ruff>=0.11,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["kcs_agent"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
