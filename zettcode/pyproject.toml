[project]
name = "zettcode"
version = "0.1.0.dev0"
description = "A focused terminal coding agent powered by zett-agent"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
authors = [{name = "Chang-LeHung"}]
dependencies = [
  "pyperclip>=1.9,<2",
  "wcwidth>=0.2,<1",
  "zett-agent==0.2.0.dev0",
]

[project.scripts]
zettcode = "zettcode.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zettcode"]

[tool.uv.sources]
zett-agent = {path = "../zett-agent", editable = true}

[dependency-groups]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.26,<2",
  "ruff>=0.11,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["zettcode"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
